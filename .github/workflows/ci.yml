name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18.17, 20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # zero runtime dependencies and no build step — nothing to install.
      # `node --test` uses built-in file discovery — the "test/**/*.test.js" glob
      # only expands on Node >=21, so it would fail the 18.17 / 20 matrix legs.
      - name: test
        run: node --test
