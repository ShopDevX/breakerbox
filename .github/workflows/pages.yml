name: Pages

on:
  push:
    branches: [main]
    paths:
      - landing/**
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble site
        run: |
          mkdir -p _site
          cp landing/index.html      _site/index.html
          cp docs/how-it-works.html  _site/how-it-works.html
          cp docs/demo.svg           _site/demo.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
